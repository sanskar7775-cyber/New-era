name: Build New Era APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK & accept licenses
        run: |
          set -e
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          mkdir -p "$SDK_DIR" || true
          sudo chown -R "$(id -u):$(id -g)" "$SDK_DIR" 2>/dev/null || SDK_DIR="$HOME/android-sdk"
          mkdir -p "$SDK_DIR/licenses"

          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_DIR/licenses/android-sdk-preview-license"

          SDKMGR="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$SDKMGR" ] || [ ! -x "$SDKMGR" ]; then
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-extract
            rm -rf "$SDK_DIR/cmdline-tools/latest"
            mv /tmp/cmdline-extract/cmdline-tools "$SDK_DIR/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-extract
            SDKMGR="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          fi

          chmod +x "$SDKMGR"
          yes | "$SDKMGR" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0" || \
            "$SDKMGR" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Prepare debug keystore and env
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -s debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ -n "$GOOGLE_SERVICES_JSON" ] && [ ! -f app/google-services.json ]; then
            if printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json 2>/dev/null && grep -q "project_info" app/google-services.json; then
              echo "Restored app/google-services.json from base64 secret."
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              echo "Wrote app/google-services.json from secret."
            fi
          fi
          if [ ! -f app/google-services.json ]; then
            echo "Notice: app/google-services.json is absent; building APK with local auth & preview fallback."
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Xmx3g -XX:MaxMetaspaceSize=1g"
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-configuration-cache --console=plain -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" -Dorg.gradle.workers.max=2 2>&1 | tee gradle-build.log || {
            echo "=== FAILURE SUMMARY ==="
            grep -A 40 "FAILURE: Build failed" gradle-build.log || tail -n 80 gradle-build.log
            exit 1
          }

      - name: Stage APK for upload
        run: |
          mkdir -p dist-apk
          APK_PATH=$(find app/build/outputs .build-outputs -type f -name "*.apk" 2>/dev/null | head -n 1 || true)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found under app/build/outputs or .build-outputs!"
            find app/build -maxdepth 5 2>/dev/null || true
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" dist-apk/NewEra-debug.apk
          ls -lh dist-apk/NewEra-debug.apk

      - name: Upload New Era Debug APK
        id: upload_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: NewEra-debug-apk
          path: dist-apk/NewEra-debug.apk
          retention-days: 7
          overwrite: true
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        id: gh_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-v1.0.${{ github.run_number }}"
          gh release create "$TAG" dist-apk/NewEra-debug.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "New Era APK (#${{ github.run_number }})" \
            --notes "Direct Android APK download for phone installation."

      - name: Verify at least one APK distribution succeeded
        if: steps.upload_artifact.outcome != 'success' && steps.gh_release.outcome != 'success'
        run: |
          echo "Artifact upload outcome: ${{ steps.upload_artifact.outcome }}"
          echo "GitHub Release outcome: ${{ steps.gh_release.outcome }}"
          exit 1
